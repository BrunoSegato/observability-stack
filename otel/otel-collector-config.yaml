extensions:
  health_check:
    endpoint: ":13133"

connectors:
  span_metrics:
    histogram:
      explicit:
        buckets: [ 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s ]
    dimensions:
      - name: http.method
      - name: http.status_code
      - name: http.route
    aggregation_temporality: "CUMULATIVE"
    metrics_flush_interval: 15s

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

  # Map stable HTTP attributes onto the legacy names used as span_metrics dimensions,
  # so old and new instrumentations are aggregated into the same series.
  # Runs on spans (before aggregation) and only in the span metrics pipeline,
  # leaving the spans stored in Tempo and ClickHouse untouched.
  transform/http_semconv:
    trace_statements:
      - context: span
        statements:
          - set(attributes["http.method"], attributes["http.request.method"]) where attributes["http.request.method"] != nil
          - set(attributes["http.status_code"], attributes["http.response.status_code"]) where attributes["http.response.status_code"] != nil

  # Expose service.name as the service_name label on application metrics,
  # matching the label used by the span metrics
  transform/service_name:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["service.name"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil

  # The Prometheus exporter keeps only the last value of delta sums,
  # so convert them to cumulative (SDKs configured with delta temporality)
  delta_to_cumulative:

exporters:
  debug:
    verbosity: detailed

  prometheus:
    endpoint: "0.0.0.0:8889"

  otlp_http:
    endpoint: http://tempo:4318
    tls:
      insecure: true

  # Loki native OTLP ingestion (the exporter appends /v1/logs)
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: default
    username: default
    traces_table_name: otel_traces


service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http, clickhouse]
    traces/span_metrics:
      receivers: [otlp]
      processors: [transform/http_semconv, batch]
      exporters: [span_metrics]
    metrics:
      receivers: [span_metrics]
      processors: [batch]
      exporters: [prometheus]
    metrics/otlp:
      receivers: [otlp]
      processors: [delta_to_cumulative, transform/service_name, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
